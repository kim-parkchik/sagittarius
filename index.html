<script>
// 公開ページに足す（devtools/build_page.sh が、pyxel app2html の出力のあとにつける。2026-11-11 から）。
// スマホのブラウザは、長く置いたときやメモリが足りないときに、絵を描く仕組み（WebGL）を手放すことがある。
// そうなると、Pyxel の画面は消えたまま戻らない（ゲームと音は動きつづけ、十字キーやボタンも残る。Pyxel 2.9.5 の
// pyxel.js には、描き直す仕組みがない）。手放されたら、ひと言知らせて、タップでページを読み直す
// （クリアした面とランキングは、ブラウザの localStorage に残っている）
(function () {
  var shown = false;
  function notice() {
    if (shown) {
      return;
    }
    shown = true;
    var d = document.createElement("div");
    d.id = "sagittarius-screen-lost";
    d.style.cssText = "position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483647;background:rgba(0,0,0,0.92);" +
      "color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;" +
      "font-family:monospace;font-size:16px;line-height:1.8;padding:24px;cursor:pointer;user-select:none";
    d.innerHTML = "THE SCREEN WAS LOST<br>" +
      "<span style='color:#8a8a9a;font-size:13px'>(the browser let go of the graphics)</span><br><br>" +
      "TAP TO RELOAD<br>" +
      "<span style='color:#8a8a9a;font-size:13px'>Cleared stages and the ranking are kept.</span>";
    var reload = function (e) {
      e.preventDefault();
      location.reload();
    };
    d.addEventListener("click", reload);
    d.addEventListener("touchend", reload);
    (document.body || document.documentElement).appendChild(d);
  }
  var tries = 0;
  var timer = setInterval(function () {        // Pyxel が画面（canvas#canvas）を作るのを待つ
    var c = document.querySelector("canvas#canvas");
    if (c) {
      clearInterval(timer);
      c.addEventListener("webglcontextlost", notice, false);
    } else if (++tries > 2400) {               // 10 分たっても作られなければ、あきらめる
      clearInterval(timer);
    }
  }, 250);
})();
</script>
